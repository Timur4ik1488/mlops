version: '3.8'

services:
  ml-academy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uncflow-ml-academy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    labels:
      - "app=uncflow"
      - "tier=frontend-academy"
