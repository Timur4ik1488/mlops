version: '3.8'

services:
  ml-academy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uncflow-ml-academy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Постоянное хранилище для бесплатных SSL-сертификатов Let's Encrypt
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=timops.duckdns.org
    labels:
      - "app=uncflow"
      - "domain=timops.duckdns.org"

volumes:
  caddy_data:
  caddy_config:
