# Конфигурация Nginx для твоего сервера под домен timops.duckdns.org
# Путь на сервере: /etc/nginx/sites-available/timops.duckdns.org
# (или вставь блок location / в твой существующий default файл)

server {
    listen 80;
    server_name timops.duckdns.org www.timops.duckdns.org;

    # Автоматический редирект HTTP -> HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name timops.duckdns.org www.timops.duckdns.org;

    # SSL сертификаты от Certbot / Let's Encrypt
    # (Пути подставятся автоматически после выполнения certbot)
    ssl_certificate /etc/letsencrypt/live/timops.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timops.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Проксирование запросов в наш Docker контейнер uncflow ML Academy
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket и keepalive заголовки
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Оптимизация кэширования для статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
